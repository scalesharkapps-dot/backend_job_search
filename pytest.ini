[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    unit: pure unit tests without I/O
    real_db: requires a real PostgreSQL database (TEST_REAL_DATABASE_URL)
    real_external: requires real external credentials (Supabase / RapidAPI)
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
