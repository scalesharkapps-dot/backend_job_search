name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, secrets scan, unit tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts alembic/env.py
      - run: python scripts/check_secrets.py
      - run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  postgres:
    name: Migrations + full test suite (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: localtestpw
          POSTGRES_DB: sharkhire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DB: postgresql://postgres:localtestpw@localhost:5432/sharkhire_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migration chain (upgrade, model check, downgrade, re-upgrade)
        run: |
          alembic -x db_url=$MIGRATION_DB upgrade head
          alembic -x db_url=$MIGRATION_DB check
          alembic -x db_url=$MIGRATION_DB downgrade base
          alembic -x db_url=$MIGRATION_DB upgrade head
          alembic -x db_url=$MIGRATION_DB downgrade base
      - name: Full test suite on PostgreSQL
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.MIGRATION_DB }}

  docker:
    name: Build production image
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sharkhire-api:ci .
      - name: Image refuses to start without production configuration
        run: |
          if docker run --rm sharkhire-api:ci; then echo "expected failure"; exit 1; fi
